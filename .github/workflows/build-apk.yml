name: Build & Upload SORA HR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Initialize & Configure Flutter Android Project
        run: |
          cd sora_mobile_flutter
          flutter create --platforms=android --org com.sorahr .
          flutter pub get
          # Inject Camera & GPS permissions into AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android Release APK
        run: |
          cd sora_mobile_flutter
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../SORA-HR-Employee-App.apk

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SORA-HR-Employee-App-APK
          path: SORA-HR-Employee-App.apk

      # Optional Google Drive Upload (Only runs if GDRIVE_CREDENTIALS and GDRIVE_FOLDER_ID are set)
      - name: Upload to Google Drive (Optional)
        if: "${{ secrets.GDRIVE_CREDENTIALS != '' && secrets.GDRIVE_FOLDER_ID != '' }}"
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "SORA-HR-Employee-App.apk"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: "SORA-HR-Employee-App.apk"
          overwrite: "true"
