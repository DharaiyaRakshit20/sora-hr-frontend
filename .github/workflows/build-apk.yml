name: Build SORA HR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Rebuild Android Platform Files
        run: |
          cd sora_mobile_flutter
          
          # Backup lib & pubspec
          mkdir -p /tmp/sora_backup
          cp -r lib /tmp/sora_backup/lib
          cp pubspec.yaml /tmp/sora_backup/pubspec.yaml
          
          # Wipe existing manual android folder completely
          rm -rf android
          
          # Re-create clean Android platform project using the runner's Flutter version
          flutter create --platforms=android --org com.sorahr --project-name sora_hr_mobile .
          
          # Restore exact lib and pubspec
          rm -rf lib
          cp -r /tmp/sora_backup/lib lib
          cp /tmp/sora_backup/pubspec.yaml pubspec.yaml

          # Generate SORA HR App Launcher Icons from sora-hr-icon-512.png
          python3 - << 'EOF'
          import os
          from PIL import Image

          icon_src = 'assets/sora-hr-icon-512.png'
          if not os.path.exists(icon_src):
              icon_src = 'assets/sora-hr-icon.png'
          if not os.path.exists(icon_src):
              icon_src = '../sora-hr-icon-512.png'

          print(f"Generating Android launcher icons from: {icon_src}")
          img = Image.open(icon_src).convert('RGBA')

          densities = {
              'mipmap-mdpi': (48, 48),
              'mipmap-hdpi': (72, 72),
              'mipmap-xhdpi': (96, 96),
              'mipmap-xxhdpi': (144, 144),
              'mipmap-xxxhdpi': (192, 192),
          }

          for folder, size in densities.items():
              target_dir = os.path.join('android', 'app', 'src', 'main', 'res', folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize(size, Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')

          print("Successfully generated SORA HR launcher icons for all screen densities!")
          EOF

          # Inject App Name "SORA HR" and Camera, Location & Internet permissions into AndroidManifest.xml
          python3 - << 'EOF'
          import re
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest, 'r') as f:
              code = f.read()

          # Set app display name on phone home screen to "SORA HR"
          code = re.sub(r'android:label="[^"]*"', 'android:label="SORA HR"', code)

          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
          """
          if '<uses-permission android:name="android.permission.CAMERA"' not in code:
              code = code.replace('<application', perms + '\n    <application')
          
          # Enable cleartext HTTP traffic for local server testing
          code = code.replace('<application', '<application android:usesCleartextTraffic="true"')
          
          with open(manifest, 'w') as f:
              f.write(code)
          print("Updated AndroidManifest.xml with 'SORA HR' label successfully")
          EOF

          # Ensure minSdk is 21 for webview_flutter compatibility
          python3 - << 'EOF'
          gradle_file = 'android/app/build.gradle'
          try:
              with open(gradle_file, 'r') as f:
                  gcode = f.read()
              gcode = gcode.replace('flutter.minSdkVersion', '21')
              with open(gradle_file, 'w') as f:
                  f.write(gcode)
              print("Updated build.gradle with minSdk 21")
          except Exception as e:
              print(f"Notice during build.gradle update: {e}")
          EOF

      - name: Fetch Flutter Dependencies & Generate Launcher Icons
        run: |
          cd sora_mobile_flutter
          flutter pub get
          dart run flutter_launcher_icons || true

      - name: Build Android Release APK
        run: |
          cd sora_mobile_flutter
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../SORA-HR-Employee-App.apk

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SORA-HR-Employee-App-APK
          path: SORA-HR-Employee-App.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SORA HR Mobile App v1.0.${{ github.run_number }}
          body: |
            ## 📱 SORA HR — Employee Mobile App
            Android APK built by GitHub Actions.
            Download the file directly to install on Android phone or upload to Google Drive.
          files: SORA-HR-Employee-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
