    // Haversine formula for distance in meters
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Earth radius in meters
      const rad1 = lat1 * Math.PI / 180;
      const rad2 = lat2 * Math.PI / 180;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(rad1) * Math.cos(rad2) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    // Number to Indian Words converter
    function numberToWords(num) {
      const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

      function inWords(n) {
        if ((n = n.toString()).length > 9) return 'Overflow';
        const nArr = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!nArr) return '';
        let str = '';
        str += (Number(nArr[1]) !== 0) ? (a[Number(nArr[1])] || b[nArr[1][0]] + ' ' + a[nArr[1][1]]) + 'Crore ' : '';
        str += (Number(nArr[2]) !== 0) ? (a[Number(nArr[2])] || b[nArr[2][0]] + ' ' + a[nArr[2][1]]) + 'Lakh ' : '';
        str += (Number(nArr[3]) !== 0) ? (a[Number(nArr[3])] || b[nArr[3][0]] + ' ' + a[nArr[3][1]]) + 'Thousand ' : '';
        str += (Number(nArr[4]) !== 0) ? (a[Number(nArr[4])] || b[nArr[4][0]] + ' ' + a[nArr[4][1]]) + 'Hundred ' : '';
        str += (Number(nArr[5]) !== 0) ? ((str !== '') ? 'and ' : '') + (a[Number(nArr[5])] || b[nArr[5][0]] + ' ' + a[nArr[5][1]]) : '';
        return str.trim();
      }
      return inWords(num) + ' Rupees Only';
    }

          method: punchMethod
        };

        setAttendanceLogs(prev => [newLog, ...prev.filter(l => l.date !== newLog.date)]);
        addToast('Clock In Successful', `Punched in at ${timeFormatted}. Shift timer is now active!`, 'success');
      };

      // -----------------------------------------------------------------------
      // BREAK MANAGEMENT FLOW
      // -----------------------------------------------------------------------
      const startBreak = (breakName = 'Lunch Break') => {
        const now = new Date();
        setShiftState(prev => ({
          ...prev,
          status: 'ON_BREAK',
          breakStartTime: now.toISOString(),
          currentBreakName: breakName
        }));
        setIsBreakModalOpen(false);
        addToast('Break Started', `Enjoy your ${breakName}! Break stopwatch is ticking.`, 'info');
      };

      const endBreak = () => {
        if (!shiftState.breakStartTime) return;
        const now = new Date();
        const breakStart = new Date(shiftState.breakStartTime);
        const durationSec = Math.max(0, Math.floor((now - breakStart) / 1000));
        const durationMin = Math.round(durationSec / 60);

        setShiftState(prev => ({
          ...prev,
          status: 'WORKING',
          breakStartTime: null,
          totalBreakSeconds: prev.totalBreakSeconds + durationSec
        }));

        // Update break in attendance log
        setAttendanceLogs(prev => prev.map((l, idx) => {
          if (idx === 0) {
            return { ...l, breakMinutes: (l.breakMinutes || 0) + durationMin };
          }
          return l;
        }));

        addToast('Break Ended', `Resumed work. Total break logged: ${durationMin} min.`, 'success');
      };

      // -----------------------------------------------------------------------
      // CLOCK-OUT FLOW
      // -----------------------------------------------------------------------
      const handleClockOut = () => {
        const now = new Date();
        const timeFormatted = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

        let totalWorkedSeconds = 0;
        if (shiftState.clockInTime) {
          const inDate = new Date(shiftState.clockInTime);
          totalWorkedSeconds = Math.max(0, Math.floor((now - inDate) / 1000) - shiftState.totalBreakSeconds);
        }

        const hrs = Math.floor(totalWorkedSeconds / 3600);
        const mins = Math.floor((totalWorkedSeconds % 3600) / 60);
        const hoursFormatted = `${String(hrs).padStart(2, '0')}h ${String(mins).padStart(2, '0')}m`;

        setShiftState(prev => ({
          ...prev,
          status: 'COMPLETED',
          clockOutTime: now.toISOString(),
          todayPunches: prev.todayPunches + 1
        }));

        const outLat = (hrSettings.officeLat || 19.0658) + 0.0004;
        const outLng = (hrSettings.officeLng || 72.8688) + 0.0003;
        const outLocation = 'BKC Campus Main Tower Exit, Mumbai, Maharashtra, India';

        setAttendanceLogs(prev => prev.map((l, idx) => {
          if (idx === 0) {
            return {
              ...l,
              outTime: timeFormatted,
              hours: hoursFormatted,
              outLat: outLat,
              outLng: outLng,
              outLocation: outLocation
            };
          }
          return l;
        }));

        addToast('Shift Completed', `Clocked out at ${timeFormatted}. Total productive hours: ${hoursFormatted}. Have a great evening!`, 'success');
      };

      // Format seconds into HH:MM:SS
      const formatDuration = (totalSeconds) => {
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      // -----------------------------------------------------------------------
      // LEAVE MANAGEMENT HANDLERS
      // -----------------------------------------------------------------------
      const handleApplyLeave = (leaveData) => {
        const newReq = {
          id: `LV-2026-${String(Math.floor(Math.random() * 900) + 100)}`,
          empCode: currentUser.id,
          empName: currentUser.name,
          type: leaveData.type,
          dates: `${leaveData.fromDate} to ${leaveData.toDate}`,
          days: leaveData.days,
          reason: leaveData.reason,
          status: 'Pending Review',
          appliedOn: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
        };

        setLeaveRequests(prev => [newReq, ...prev]);
        setIsApplyLeaveModalOpen(false);
        addToast('Leave Application Submitted', `Your request for ${leaveData.days} day(s) ${leaveData.type} is submitted for HR approval.`, 'success');
      };

      const handleApproveLeave = (id) => {
        const req = leaveRequests.find(r => r.id === id);
        if (!req) return;

        setLeaveRequests(prev => prev.map(r => r.id === id ? { ...r, status: 'Approved' } : r));

        // Deduct from quota if Casual / Sick / Paid
        const codeMap = { 'Casual Leave (CL)': 'CL', 'Sick Leave (SL)': 'SL', 'Privilege / Paid Leave (PL)': 'PL' };
        const code = codeMap[req.type];
        if (code && leaveQuotas[code]) {
          setLeaveQuotas(prev => ({
            ...prev,
            [code]: {
              ...prev[code],
              remaining: Math.max(0, prev[code].remaining - req.days),
              used: prev[code].used + req.days
            }
          }));
        }

        addToast('Leave Approved', `Approved leave application #${id} for ${req.empName}.`, 'success');
      };

      const handleRejectLeave = (id) => {
        setLeaveRequests(prev => prev.map(r => r.id === id ? { ...r, status: 'Rejected' } : r));
        addToast('Leave Rejected', `Leave application #${id} was marked as rejected.`, 'info');
      };

      const handleCancelLeave = (id) => {

      // -----------------------------------------------------------------------

      const inTime = log.inTime || '09:28 AM';

      // 2. Clock Out Data
      const hasClockedOut = log.outTime && log.outTime !== '--:--';
      const outLat = hasClockedOut 
        ? Number(log.outLat || inLat + 0.0006) 
        : null;
      const outLng = hasClockedOut 
        ? Number(log.outLng || inLng + 0.0007) 
        : null;
      const outLocation = hasClockedOut

        : 'Shift in Progress (Clock-Out pending)';
      const outTime = hasClockedOut ? log.outTime : '--:--';

      const centerLat = outLat ? (inLat + outLat) / 2 : inLat;
      const centerLng = outLng ? (inLng + outLng) / 2 : inLng;

      // 3. OpenStreetMap URL centered on Mumbai, Maharashtra, India
      const delta = 0.0045;
      const bbox = `${centerLng - delta}%2C${centerLat - delta}%2C${centerLng + delta}%2C${centerLat + delta}`;

    // SUB-COMPONENT: MODAL A - DIRECT LIVE SELFIE CAMERA (Front Camera Default)
    // =========================================================================
    function SelfieCameraModal({ hrSettings, currentUser, onCapture, onClose }) {
      const videoRef = React.useRef(null);
      const canvasRef = React.useRef(null);
      const nativeInputRef = React.useRef(null);
      const [cameraStream, setCameraStream] = React.useState(null);
      const [cameraActive, setCameraActive] = React.useState(false);
      const [cameraLoading, setCameraLoading] = React.useState(true);
      const [facingMode, setFacingMode] = React.useState('user'); // Default strictly FRONT CAMERA
      const [capturedPhotoUrl, setCapturedPhotoUrl] = React.useState(null);

      // Start front camera stream directly on mount
      const startCamera = async (mode = 'user') => {
        setCameraLoading(true);

        // Stop existing stream
        if (cameraStream) {
          try { cameraStream.getTracks().forEach(t => t.stop()); } catch (e) {}
          setCameraStream(null);
        }

        const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

        if (hasMediaDevices) {
          const constraintOptions = [
            {
              video: {
                facingMode: mode === 'user' ? { ideal: 'user' } : { ideal: 'environment' },
                width: { ideal: 1280, max: 1920 },
                height: { ideal: 720, max: 1080 }
              },
              audio: false
            },
            {
              video: { facingMode: mode },
              audio: false
            },
            {
              video: true,
              audio: false
            }
          ];

          for (let i = 0; i < constraintOptions.length; i++) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia(constraintOptions[i]);
              setCameraStream(stream);
              setCameraActive(true);
              setCameraLoading(false);
              setFacingMode(mode);
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                videoRef.current.setAttribute('playsinline', 'true');
                videoRef.current.setAttribute('webkit-playsinline', 'true');
                videoRef.current.muted = true;
                videoRef.current.play().catch(() => {});
              }
              return; // Camera stream started successfully!
            } catch (err) {
              console.warn('Constraint attempt failed:', err);
            }
          }
        }

        // Direct device fallback if getUserMedia not supported (e.g. mobile Chrome over HTTP)
        setCameraLoading(false);
        setCameraActive(false);

        // Trigger native front camera immediately
        if (nativeInputRef.current) {
          try { nativeInputRef.current.click(); } catch (e) {}
        }
      };

      // Auto-start front camera immediately when component mounts
      React.useEffect(() => {
        startCamera('user');

        return () => {
          if (videoRef.current && videoRef.current.srcObject) {
            try {
              videoRef.current.srcObject.getTracks().forEach(t => t.stop());
            } catch (e) {}
          }
        };
      }, []);

      // Toggle Flip Camera (Front <-> Back)
      const toggleCameraFlip = () => {
        const nextMode = facingMode === 'user' ? 'environment' : 'user';
        setFacingMode(nextMode);
        startCamera(nextMode);
      };

      // Watermark photo processor
      const processPhotoWithWatermark = (sourceImgOrVideo) => {
        const canvas = canvasRef.current || document.createElement('canvas');
        const width = 640;
        const height = 480;
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        // Draw image (mirror if front camera live stream)
        ctx.save();
        if (facingMode === 'user' && sourceImgOrVideo.tagName === 'VIDEO') {
          ctx.translate(width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(sourceImgOrVideo, 0, 0, width, height);
        ctx.restore();

        // Watermark Box at bottom
        ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
        ctx.fillRect(0, height - 76, width, 76);

        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 15px monospace';
        ctx.fillText(`EMP: ${currentUser.id} - ${currentUser.name}`, 16, height - 50);

        ctx.fillStyle = '#ffffff';
        ctx.font = '12px monospace';
        const nowStr = new Date().toLocaleString('en-IN');
        ctx.fillText(`PUNCH: ${nowStr} | GEOFENCE: ${hrSettings.officeName || 'BKC Campus'}`, 16, height - 30);
        ctx.fillText(`GPS: Lat ${(hrSettings.officeLat || 19.0658).toFixed(4)}, Lng ${(hrSettings.officeLng || 72.8688).toFixed(4)} • AI Biometric Verified`, 16, height - 12);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
        setCapturedPhotoUrl(dataUrl);

        if (cameraStream) {
          try { cameraStream.getTracks().forEach(t => t.stop()); } catch (e) {}
          setCameraActive(false);

      };

        reader.readAsDataURL(file);
      };

          onCapture(capturedPhotoUrl);

    function QrScannerModal({ onSuccess, onClose }) {
      const videoRef = React.useRef(null);
      const nativeInputRef = React.useRef(null);
      const [cameraStream, setCameraStream] = React.useState(null);
      const [cameraActive, setCameraActive] = React.useState(false);
      const [isScanning, setIsScanning] = React.useState(true);

      React.useEffect(() => {
        let activeStream = null;

        const startBackCamera = async () => {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            const constraintsList = [
              { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
              { video: { facingMode: 'environment' }, audio: false },
              { video: true, audio: false }
            ];

            for (let i = 0; i < constraintsList.length; i++) {
              try {
                const stream = await navigator.mediaDevices.getUserMedia(constraintsList[i]);
                activeStream = stream;
                setCameraStream(stream);
                setCameraActive(true);
                if (videoRef.current) {
                  videoRef.current.srcObject = stream;
                  videoRef.current.setAttribute('playsinline', 'true');
                  videoRef.current.setAttribute('webkit-playsinline', 'true');
                  videoRef.current.muted = true;
                  videoRef.current.play().catch(() => {});
                }
                return;
              } catch (err) {
                console.warn('Back camera constraint failed:', err);
              }
            }
          }
        };

        startBackCamera();

        // Automatic scan detection simulation (Office standee QR verified)
        const timer = setTimeout(() => {
          setIsScanning(false);
          setTimeout(() => {
            if (activeStream) {
              try { activeStream.getTracks().forEach(t => t.stop()); } catch (e) {}
            }
            onSuccess();
          }, 800);
        }, 2000);

        return () => {
          clearTimeout(timer);
          if (activeStream) {
            try { activeStream.getTracks().forEach(t => t.stop()); } catch (e) {}
          }
        };
      }, []);

      // Direct fallback handler for phone native camera
      const handleNativeQrSnap = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          setIsScanning(false);
          if (cameraStream) {
            try { cameraStream.getTracks().forEach(t => t.stop()); } catch (e) {}
          }
          setTimeout(() => {
            onSuccess();
          }, 400);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-[#14141a] border border-neutral-800 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl text-center relative overflow-hidden">
            
            {/* Header */}
            <div className="flex items-center justify-between pb-2 border-b border-neutral-800">

                <div className="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center">
                  <Icon name="qr-code" className="w-4 h-4" />
                </div>
                <div className="text-left">
                  <h3 className="text-sm font-bold text-white">Office QR Scanner</h3>
                  <p className="text-[10px] text-neutral-400">Direct Back Camera Active</p>
                </div>
              </div>

              <button
                type="button"
                onClick={() => {
                  if (cameraStream) {
                    try { cameraStream.getTracks().forEach(t => t.stop()); } catch (e) {}
                  }
                  onClose();
                }}
                className="p-1.5 rounded-xl bg-[#181822] hover:bg-neutral-800 text-neutral-400 hover:text-white transition-colors cursor-pointer"
              >
                <Icon name="x-circle" className="w-5 h-5" />
              </button>
            </div>

            {/* Live Camera Viewfinder Screen */}
            <div
              onClick={() => {
                if (!cameraActive && nativeInputRef.current) {
                  nativeInputRef.current.click();
                }
              }}
              className="relative rounded-2xl bg-black aspect-square border-2 border-neutral-800 overflow-hidden flex items-center justify-center shadow-inner cursor-pointer"
            >
              {/* Live Video stream */}
              <video
                ref={videoRef}
                autoPlay
                playsInline
                webkit-playsinline="true"
                muted
                className={`w-full h-full object-cover ${cameraActive ? 'block' : 'hidden'}`}
              />

              {/* If camera stream waiting or restricted */}
              {!cameraActive && (
                <div className="flex flex-col items-center justify-center p-4 text-center space-y-2">
                  <Icon name="qr-code" className="w-20 h-20 text-neutral-600 animate-pulse" />
                  <p className="text-[11px] text-neutral-400 font-mono">
                    Point camera at Reception Standee QR
                  </p>
                </div>
              )}

              {/* Targeting Reticle Frame */}
              <div className="absolute inset-8 border-2 border-amber-400/80 rounded-2xl pointer-events-none flex items-center justify-center">
                {/* 4 Corner Markers */}
                <div className="absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-amber-400 -mt-1 -ml-1"></div>
                <div className="absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-amber-400 -mt-1 -mr-1"></div>
                <div className="absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-amber-400 -mb-1 -ml-1"></div>
                <div className="absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-amber-400 -mb-1 -mr-1"></div>

                {/* Animated Laser Scan Line */}
                {isScanning && (
                  <div className="absolute left-1 right-1 h-0.5 bg-gradient-to-r from-transparent via-amber-400 to-transparent shadow-[0_0_15px_#f59e0b] animate-bounce top-1/2"></div>

              </div>

              {/* Live Status Pill */}
              <div className="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-black/80 backdrop-blur-md text-[10px] font-mono text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5 shadow pointer-events-none">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>{cameraActive ? 'Back Camera Live' : 'Scanner Active'}</span>
              </div>
            </div>

            {/* Hidden native input for direct back camera fallback */}
            <input
              ref={nativeInputRef}
              type="file"
              accept="image/*"

              style={{ position: 'fixed', top: '-9999px', left: '-9999px', opacity: 0, width: '1px', height: '1px', pointerEvents: 'none' }}

            {/* Status Text & Location */}
            <div>
              <div className="text-xs font-bold text-white flex items-center justify-center gap-1.5">
                {isScanning ? (

              <p className="text-[10px] text-neutral-400 mt-1 font-mono">
                Location: BKC Reception Standee #01
              </p>
            </div>

            {/* Action Button: Instant Punch In */}
            <div className="pt-1">
              <button
                type="button"
                onClick={() => {
                  if (cameraStream) {
                    try { cameraStream.getTracks().forEach(t => t.stop()); } catch (e) {}
                  }
                  onSuccess();
                }}
                className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-neutral-950 font-black text-xs transition-all cursor-pointer shadow-lg shadow-emerald-500/20 active:scale-95 flex items-center justify-center gap-2"

    function ApplyLeaveModal({ leaveQuotas, onSubmit, onClose }) {
      const [type, setType] = useState('Casual Leave (CL)');
      const [fromDate, setFromDate] = useState('2026-11-12');
      const [toDate, setToDate] = useState('2026-11-13');
      const [dayType, setDayType] = useState('Full Day');
      const [reason, setReason] = useState('');
      const [days, setDays] = useState(2);

      const recalculateDays = (from, to, dType) => {
        setFromDate(from);
        setToDate(to);
        const d1 = new Date(from);
        const d2 = new Date(to);
        let diff = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1);
        if (dType !== 'Full Day' && diff === 1) {
          diff = 0.5;
        }
        setDays(diff);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!reason.trim()) {
          alert('Please enter a brief reason for your leave application.');
          return;
        }

        // Format dates into clean readable string: e.g. "12 Nov 2026 - 13 Nov 2026"
        const d1 = new Date(fromDate);
        const d2 = new Date(toDate);
        const opt = { day: '2-digit', month: 'short', year: 'numeric' };
        const d1Str = d1.toLocaleDateString('en-IN', opt);
        const d2Str = d2.toLocaleDateString('en-IN', opt);
        const datesFormatted = (fromDate === toDate) ? d1Str : `${d1Str} – ${d2Str}`;

        onSubmit({
          type,
          fromDate,
          toDate,
          datesFormatted,
          dayType,
          days,
          reason
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-[#14141a] border border-neutral-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl relative animate-in zoom-in-95 duration-200">

                </div>
              </div>

                type="button"
                onClick={onClose}
                className="p-1.5 rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-800 transition-colors cursor-pointer"
              >
                <Icon name="x-circle" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
              
              {/* Category */}
              <div>
                <label className="block text-[10px] font-bold text-neutral-400 uppercase tracking-wider mb-1">
                  Leave Category *
                </label>
                <select
                  value={type}
                  onChange={(e) => setType(e.target.value)}

                >
                  <option value="Casual Leave (CL)">Casual Leave (CL) &bull; 8d Remaining</option>
                  <option value="Sick Leave (SL)">Sick Leave (SL) &bull; 5d Remaining</option>
                  <option value="Privilege / Paid Leave (PL)">Privilege / Paid Leave (PL) &bull; 12d Remaining</option>
                  <option value="Compensatory Off (CO)">Compensatory Off (CO) &bull; 2d Remaining</option>
                </select>
              </div>

              {/* Date Pickers Row */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-[10px] font-bold text-neutral-400 uppercase tracking-wider mb-1">
                    From Date *
                  </label>
                  <input

                    onChange={(e) => recalculateDays(e.target.value, toDate, dayType)}

    function EmployeeProfileModal({ user, onUpdateUser, onClose }) {
      const [activeSection, setActiveSection] = useState('employment'); // 'employment' | 'statutory' | 'security'

      const handlePhotoSelect = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          alert('Please select a valid image file (PNG, JPG, JPEG, WEBP).');
          return;
        }

        setIsUploading(true);
        const reader = new FileReader();
        reader.onload = (event) => {
          const photoDataUrl = event.target.result;
          if (onUpdateUser) {
            onUpdateUser({ ...user, photoUrl: photoDataUrl });
          }
          setIsUploading(false);
        };
        reader.onerror = () => {
          setIsUploading(false);
          alert('Failed to read image file. Please try another image.');
        };
        reader.readAsDataURL(file);
      };

      const handleRemovePhoto = () => {
        if (onUpdateUser) {
          onUpdateUser({ ...user, photoUrl: null });
        }

        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 overflow-y-auto">

                    <span className="text-neutral-400">PAN Card Number</span>
                    <span className="text-emerald-400 font-mono font-bold">{user.pan}</span>
                  </div>

                  <div className="p-3 rounded-xl bg-[#181822] border border-neutral-800/80 flex items-center justify-between">
                    <span className="text-neutral-400">Universal Account No (UAN)</span>
                    <span className="text-white font-mono font-bold">{user.uan}</span>
                  </div>

                  <div className="p-3 rounded-xl bg-[#181822] border border-neutral-800/80 flex items-center justify-between">
                    <span className="text-neutral-400">Provident Fund (PF) No.</span>
                    <span className="text-white font-mono font-semibold">{user.pfNo}</span>
                  </div>

                  <div className="p-3 rounded-xl bg-[#181822] border border-neutral-800/80 flex items-center justify-between">
                    <span className="text-neutral-400">Income Tax Regime</span>
                    <span className="text-amber-400 font-bold">New Tax Regime (FY 2026-27)</span>
                  </div>
                </div>
              )}

              {/* Tab Content 3: Biometrics & Security */}
              {activeSection === 'security' && (
                <div className="space-y-2.5 text-xs">
                  <div className="p-3.5 rounded-2xl bg-[#181822] border border-neutral-800/80 space-y-2">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <Icon name="shield-check" className="w-4 h-4 text-emerald-400" />
                        <span className="font-bold text-white">AI Face Recognition</span>
                      </div>
                      <span className="px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 text-[10px] font-bold border border-emerald-500/30">
                        Enrolled
                      </span>
                    </div>
                    <p className="text-[11px] text-neutral-400">
                      Biometric facial vectors enrolled on 15 Mar 2023. Used for attendance verification.
                    </p>
                  </div>

                  <div className="p-3.5 rounded-2xl bg-[#181822] border border-neutral-800/80 space-y-2">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <Icon name="map-pin" className="w-4 h-4 text-sky-400" />
                        <span className="font-bold text-white">Authorized Geofence</span>
                      </div>
                      <span className="px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-400 text-[10px] font-bold border border-sky-500/30">
                        BKC Campus (100m)
                      </span>
                    </div>
                    <p className="text-[11px] text-neutral-400">
                      Punches permitted within 100 meters radius of SORA Tech Park, G-Block BKC.
                    </p>
                  </div>

                  <div className="p-3.5 rounded-2xl bg-[#181822] border border-neutral-800/80 space-y-2">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <Icon name="smartphone" className="w-4 h-4 text-amber-400" />
                        <span className="font-bold text-white">Device Binding</span>
                      </div>
                      <span className="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400 text-[10px] font-bold border border-amber-500/30">
                        Secured
                      </span>
                    </div>
                    <p className="text-[11px] text-neutral-400">
                      ESS session verified with device hardware signature and SSL encryption.
                    </p>
                  </div>
                </div>
              )}

              {/* Close Button */}
              <button
                type="button"
                onClick={onClose}
                className="w-full py-2.5 px-4 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-white font-bold text-xs transition-all cursor-pointer mt-2"
              >
                Close Profile
              </button>

            </div>
          </div>
        </div>
      );
    }


    // =========================================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
