name: sora_hr_mobile
description: "SORA HR — Employee Mobile App (Flutter & React Engine)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/sora-hr-icon-512.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/sora-hr-icon-512.png
    - assets/sora-hr-icon.png
