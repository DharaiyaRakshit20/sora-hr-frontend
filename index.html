<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SORA HR - Strategic People & HR Solutions</title>
    <link rel="icon" type="image/svg+xml" href="/sora-hr-icon.svg" />
    <meta name="description" content="Premium HR consulting, talent acquisition, payroll compliance, and people operations partner for forward-looking enterprises." />
    <meta property="og:title" content="SORA HR - Strategic People & HR Solutions" />
    <meta property="og:description" content="Premium HR consulting, talent acquisition, payroll compliance, and people operations partner for forward-looking enterprises." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sorahr.in" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#080808" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                black: '#09090c',
                dark: '#101014',
                surface: '#17171d',
                card: '#1d1d25',
                border: '#2b2b36',
                amber: '#f59e0b',
                amberLight: '#fbbf24',
                amberDark: '#d97706'
              }
            }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" crossorigin src="/assets/index-CyeTAMij.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DiKJCd3U.css">
  </head>
  <body class="bg-[#080808] text-[#F7F3EC] antialiased selection:bg-[#D9AD62]/20 selection:text-[#F3D69B] overflow-x-hidden min-h-screen">
    <div id="root"></div>

    <!-- SORA PLANS SCRIPT LOGIC -->
    <script>
      const defaultSoraPlans = [
        {
          id: 'plan_starter',
          name: 'Starter Plan',
          badge: 'For Small Teams',
          desc: 'Essential HR automation & employee directory for growing startups.',
          basePrice: 2499,
          baseMinEmp: 1,
          baseMaxEmp: 10,
          perEmployeePrice: 120,
          billingCycle: 'Monthly',
          status: 'Active',
          popular: false,
          modules: ['Core HR', 'Attendance (GPS)', 'Leaves & Holidays'],
          features: [
            '1-10 Employees Included in Base Slab',
            '₹120 / additional employee per month',
            'Employee Directory & Profile Vault',
            'Geofence & Mobile Attendance',
            'Leave & Holiday Approvals',
            'Self-Service Mobile App Access'
          ]
        },
        {
          id: 'plan_growth',
          name: 'Growth Pro',
          badge: 'Most Popular',
          desc: 'Complete HRMS, statutory payroll calculation, and recruitment suite.',
          basePrice: 5999,
          baseMinEmp: 1,
          baseMaxEmp: 25,
          perEmployeePrice: 150,
          billingCycle: 'Monthly',
          status: 'Active',
          popular: true,
          modules: ['Core HR', 'Attendance', 'Leaves', 'Payroll', 'ATS Recruitment'],
          features: [
            '1-25 Employees Included in Base Slab',
            '₹150 / additional employee per month',
            'Automated Multi-State Statutory Payroll',
            'Applicant Tracking System (ATS)',
            'Biometric & Shift Rostering',
            'EPF, ESIC, PT, TDS Compliance Exports',
            'Priority 24/7 Email & Phone Support'
          ]
        },
        {
          id: 'plan_enterprise',
          name: 'Enterprise Elite',
          badge: 'Full Suite',
          desc: 'Unlimited power with performance appraisal, training, audit readiness & custom APIs.',
          basePrice: 12999,
          baseMinEmp: 1,
          baseMaxEmp: 50,
          perEmployeePrice: 180,
          billingCycle: 'Monthly',
          status: 'Active',
          popular: false,
          modules: ['All HRMS Modules', 'Performance', 'Audit', 'Custom APIs'],
          features: [
            '1-50 Employees Included in Base Slab',
            '₹180 / additional employee per month',
            '360° KPI & Performance Appraisals',
            'L&D Training LMS & Certifications',
            'Statutory Audit & Labor Law Vault',
            'Dedicated Enterprise Account Manager',
            'Custom API & ERP Integrations'
          ]
        }
      ];

      let liveEmployeeCount = 15;

      function getPlansData() {
        try {
          const stored = localStorage.getItem('sora_plans_data');
          if (stored) return JSON.parse(stored);
        } catch (e) {
          console.warn('LocalStorage error:', e);
        }
        return defaultSoraPlans;
      }

      function renderWebsitePlansSection() {
        const mount = document.getElementById('soraPlansMount');
        if (!mount) return;

        const plans = getPlansData().filter(p => p.status === 'Active');

        const cardsHtml = plans.map(plan => {
          const isPopular = !!plan.popular;
          const baseMax = plan.baseMaxEmp || 10;
          const perEmp = plan.perEmployeePrice || 150;
          const extraEmployees = Math.max(0, liveEmployeeCount - baseMax);
          const extraCost = extraEmployees * perEmp;
          const totalMonthly = plan.basePrice + extraCost;

          const featuresHtml = (plan.features || []).map(f => `
            <li class="flex items-start gap-2.5 text-neutral-300 text-xs">
              <i data-lucide="check-circle-2" class="w-4 h-4 text-amber-400 flex-shrink-0 mt-0.5"></i>
              <span>${f}</span>
            </li>
          `).join('');

          return `
            <div class="relative rounded-3xl bg-[#14141c]/95 border ${isPopular ? 'border-amber-400 shadow-[0_0_40px_rgba(245,158,11,0.25)]' : 'border-[#262630]'} p-7 flex flex-col justify-between space-y-6 transition-all duration-300 hover:scale-[1.02] hover:border-amber-400/80">
              ${isPopular ? `
                <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 text-neutral-950 font-black text-[10px] uppercase tracking-widest shadow-lg">
                  ${plan.badge || 'Most Popular'}
                </div>
              ` : ''}

              <div class="space-y-4">
                <div>
                  <div class="flex items-center justify-between">
                    <h3 class="text-xl font-black text-white">${plan.name}</h3>
                  </div>
                  <p class="text-xs text-neutral-400 mt-1">${plan.desc}</p>
                </div>

                <!-- Dynamic Computed Price for liveEmployeeCount -->
                <div class="p-4 rounded-2xl bg-[#09090d] border border-[#262630] space-y-2">
                  <div class="flex items-baseline gap-1">
                    <span class="text-3xl font-black text-amber-400 font-mono">₹${Math.round(totalMonthly).toLocaleString('en-IN')}</span>
                    <span class="text-xs text-neutral-400">/ month</span>
                  </div>
                  <div class="text-[11px] text-neutral-300 flex items-center justify-between font-mono pt-1 border-t border-[#1e1e26]">
                    <span>Base (${plan.baseMinEmp || 1}-${baseMax} emp):</span>
                    <span>₹${plan.basePrice.toLocaleString('en-IN')}</span>
                  </div>
                  ${extraEmployees > 0 ? `
                    <div class="text-[11px] text-amber-300 flex items-center justify-between font-mono">
                      <span>+${extraEmployees} Extra @ ₹${perEmp}/emp:</span>
                      <span>+₹${extraCost.toLocaleString('en-IN')}</span>
                    </div>
                  ` : `
                    <div class="text-[10px] text-emerald-400 font-medium">
                      ✓ Fits in base slab (Zero extra charges)
                    </div>
                  `}
                </div>

                <!-- Features Bullets -->
                <ul class="space-y-2.5 pt-2">
                  ${featuresHtml}
                </ul>
              </div>

              <div class="pt-4 border-t border-[#262630]">
                <button type="button" onclick="openCheckoutModal('${plan.id}')" class="w-full py-3 rounded-xl ${isPopular ? 'bg-gradient-to-r from-amber-400 to-amber-500 text-neutral-950 font-black shadow-lg shadow-amber-500/20 hover:from-amber-300 hover:to-amber-400' : 'bg-[#1c1c24] hover:bg-[#262632] text-white font-bold border border-[#2b2b36] hover:border-amber-400/50'} text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2">
                  <span>Get Started &bull; Buy Plan</span>
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');

        // If #pricing already exists in DOM, just smoothly update the cards & slider text to prevent full rebuild
        const existingSection = document.getElementById('pricing');
        const cardsGrid = document.getElementById('soraCardsGrid');
        if (existingSection && cardsGrid) {
          cardsGrid.innerHTML = cardsHtml;
          const disp = document.getElementById('empSliderDisplay');
          if (disp) disp.innerText = `${liveEmployeeCount} Employees`;
          if (typeof lucide !== 'undefined') lucide.createIcons();
          return;
        }

        mount.innerHTML = `
          <section id="pricing" class="relative z-10 py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto my-12 bg-[#0c0c10]/95 backdrop-blur-md border border-[#262630] rounded-3xl shadow-2xl overflow-hidden">
            <!-- Subtle ambient amber/gold glows inside container -->
            <div class="absolute -top-32 -right-32 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10">
              <!-- Section Header -->
              <div class="text-center space-y-3 max-w-3xl mx-auto mb-12">
                <span class="text-xs font-bold uppercase tracking-widest text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3.5 py-1 rounded-full inline-flex items-center gap-1.5 shadow-sm">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
                  <span>SaaS Subscription Plans</span>
                </span>
                <h2 class="text-3xl sm:text-5xl font-black text-white tracking-tight">
                  Transparent Plans. <span class="bg-gradient-to-r from-amber-400 to-amber-500 bg-clip-text text-transparent">Scale as You Grow.</span>
                </h2>
                <p class="text-sm text-neutral-400 leading-relaxed max-w-2xl mx-auto">
                  Choose your foundational HRMS plan. Slide your current employee headcount below to view real-time dynamic pricing with our transparent per-employee rate.
                </p>
              </div>

              <!-- Interactive Headcount Slider Box -->
              <div class="max-w-xl mx-auto p-6 rounded-3xl bg-[#14141c]/90 border border-amber-500/30 shadow-xl mb-12 text-center space-y-4">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-neutral-300 uppercase tracking-wider flex items-center gap-1.5">
                    <i data-lucide="users" class="w-4 h-4 text-amber-400"></i>
                    <span>Select Your Team Size:</span>
                  </span>
                  <span class="text-lg font-black text-amber-400 font-mono bg-amber-500/10 px-3.5 py-1 rounded-xl border border-amber-500/30 shadow-xs" id="empSliderDisplay">${liveEmployeeCount} Employees</span>
                </div>
                <input type="range" id="empSliderInput" min="1" max="150" value="${liveEmployeeCount}" oninput="updateLiveEmployeeCount(this.value)" class="w-full accent-amber-400 cursor-pointer h-2 bg-[#20202a] rounded-lg">
                <div class="flex justify-between text-[10px] text-neutral-500 font-mono">
                  <span>1 Emp (Solo/Startup)</span>
                  <span>25 Emp</span>
                  <span>50 Emp</span>
                  <span>100 Emp</span>
                  <span>150+ Emp</span>
                </div>
              </div>

              <!-- Dynamic 3-Column Plan Cards Grid -->
              <div id="soraCardsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                ${cardsHtml}
              </div>

              <!-- Trust Badges -->
              <div class="mt-14 pt-8 border-t border-[#1e1e26] text-center text-xs text-neutral-400 flex flex-wrap items-center justify-center gap-8">
                <span class="flex items-center gap-1.5 font-medium"><i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i> Instant Workspace Activation</span>
                <span class="flex items-center gap-1.5 font-medium"><i data-lucide="credit-card" class="w-4 h-4 text-amber-400"></i> Razorpay &amp; UPI Verified</span>
                <span class="flex items-center gap-1.5 font-medium"><i data-lucide="refresh-cw" class="w-4 h-4 text-cyan-400"></i> Cancel or Scale Seats Anytime</span>
              </div>
            </div>
          </section>
        `;

        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      function updateLiveEmployeeCount(val) {
        liveEmployeeCount = parseInt(val) || 1;
        renderWebsitePlansSection();
      }

      function openCheckoutModal(planId) {
        window.location.href = '/checkout/?plan=' + encodeURIComponent(planId) + '&emp=' + (liveEmployeeCount || 10);
      }

      function mountPlansSection() {
        if (document.getElementById('pricing')) return true;

        const whyUs = document.getElementById('why-us') || document.getElementById('contact') || document.querySelector('footer');
        if (!whyUs || !whyUs.parentNode) return false;

        let mount = document.getElementById('soraPlansMount');
        if (!mount) {
          mount = document.createElement('div');
          mount.id = 'soraPlansMount';
        }
        whyUs.parentNode.insertBefore(mount, whyUs);
        renderWebsitePlansSection();
        return true;
      }

      window.addEventListener('DOMContentLoaded', () => {
        let attempts = 0;
        const timer = setInterval(() => {
          attempts++;
          if (mountPlansSection() || attempts > 60) {
            clearInterval(timer);
          }
        }, 80);
      });
    </script>
</html>
