<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <!-- Warm amber gradient matching the SORA theme -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Brand Emblem: Glowing interconnected node / stylized modern S -->
  <g transform="translate(10, 16)">
    <!-- Ambient subtle halo behind icon -->
    <circle cx="24" cy="24" r="22" fill="#F59E0B" fill-opacity="0.15" filter="url(#subtleGlow)"/>
    <!-- Outer ring with open dynamic arcs -->
    <circle cx="24" cy="24" r="20" stroke="url(#amberGlow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="85 30"/>
    <!-- Central stylized HR humanity knot / infinity S -->
    <path d="M16 28 C 16 20, 24 20, 24 24 C 24 28, 32 28, 32 20" stroke="#FFF7ED" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="28" r="2.5" fill="#F59E0B"/>
    <circle cx="32" cy="20" r="2.5" fill="#FCD34D"/>
    <circle cx="24" cy="24" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography: SORA -->
  <text x="68" y="50" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="0.08em" fill="#FFFFFF">
    SORA
  </text>

  <!-- Vertical Divider Bar in Signature Amber -->
  <line x1="184" y1="24" x2="184" y2="54" stroke="url(#amberGlow)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Brand Typography: HR -->
  <text x="200" y="50" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="0.1em" fill="#FFFFFF">
    HR
  </text>

  <!-- Subtle smart tagline for email/branding -->
  <text x="70" y="66" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="0.28em" fill="#A1A1AA">
    PEOPLE &bull; PAYROLL &bull; GROWTH
  </text>
</svg>
